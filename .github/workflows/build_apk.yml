name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      # Generate a fresh Android project.
      - name: Generate Android Project
        run: flutter create --platforms=android --project-name islamic_book_app .

      # Find logo.png.
      - name: Find App Logo
        shell: bash
        run: |
          LOGO_PATH=$(find . -type f -name "logo.png" -not -path "./.git/*" | head -n 1)

          if [ -z "$LOGO_PATH" ]; then
            echo "ERROR: logo.png was not found in the repository!"
            echo "Please upload logo.png to the repository."
            exit 1
          fi

          echo "Logo found at: $LOGO_PATH"

          # If logo.png is already in the root folder, do nothing.
          if [ "$LOGO_PATH" != "./logo.png" ]; then
            cp "$LOGO_PATH" ./logo.png
          fi

          echo "App logo is ready."

      # Configure Android application name and Internet permission.
      - name: Configure Android App
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

          # Set Android launcher application name.
          sed -i 's/android:label="[^"]*"/android:label="সদস্য সিলেবাসের বই"/' "$MANIFEST"

          # Add Internet permission if missing.
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          echo "Application name:"
          grep 'android:label=' "$MANIFEST"

          echo "Internet permission:"
          grep 'android.permission.INTERNET' "$MANIFEST"

      # Add launcher icon package.
      - name: Add Launcher Icon Package
        run: flutter pub add --dev flutter_launcher_icons

      # Create launcher icon configuration.
      - name: Create Launcher Icon Config
        shell: bash
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "logo.png"
            min_sdk_android: 21
          EOF

          echo "Launcher icon configuration:"
          cat flutter_launcher_icons.yaml

      # Get Flutter dependencies.
      - name: Flutter Pub Get
        run: flutter pub get

      # Generate Android launcher icons.
      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # Analyze project.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Build release APK.
      - name: Build Release APK
        run: flutter build apk --release

      # Upload APK.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: member-syllabus-books
          path: build/app/outputs/flutter-apk/app-release.apk
