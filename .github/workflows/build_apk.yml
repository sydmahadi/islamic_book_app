name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      # Generate a fresh Android project.
      - name: Generate Android Project
        run: flutter create --platforms=android --project-name islamic_book_app .

      # Make sure Android app has Internet permission.
      - name: Ensure Internet Permission
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          echo "Internet permission:"
          grep 'android.permission.INTERNET' "$MANIFEST"

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-book-app
          path: build/app/outputs/flutter-apk/app-release.apk
